<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🎂 生日快乐交响曲 · 敲击键盘为 TA 演奏</title>
<meta name="description" content="Patatap 风格的互动生日祝福页：每个键都有专属的声音和动画，空格有惊喜，回车自动演奏生日歌。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="stage"></canvas>

<div id="intro">
  <div class="cake">🎂</div>
  <h1>生日快乐交响曲</h1>
  <p id="name-line" class="name"></p>
  <p class="sub">
    像 <a href="https://patatap.com" target="_blank" rel="noopener">patatap</a> 一样，
    每个键都有专属的声音和动画 —— 用键盘为 TA 敲出一场独一无二的生日演奏
  </p>
  <p class="hint">点击任意处 · 或按任意键开始</p>
</div>

<button id="mute" aria-label="静音开关" title="静音 / 取消静音">🔊</button>

<div id="hud">A–Z 专属声音 · 1–8 音阶 · 空格 = 惊喜 · 回车 = 自动演奏生日歌</div>
<div id="loading" hidden>正在加载音乐…</div>
<div id="msg"></div>

<script src="script.js"></script>
</body>
</html>
